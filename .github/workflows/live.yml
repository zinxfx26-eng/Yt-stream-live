name: YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download video
        run: |
          wget -O video.mp4 "https://drive.google.com/uc?export=download&id=1U17yK4g1Dxu25lZpvzNUKu6LHMdTDMzg"

      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 \
          -c:v libx264 -preset veryfast -pix_fmt yuv420p \
          -c:a aac -b:a 128k \
          -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
          
